<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食品安全与特种设备监管应知应会测试卷 · 在线答题</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#b45309;
  --okbg:#f0fdf4;--badbg:#fef2f2;--missbg:#fffbeb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:86px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.topbar .inner{max-width:880px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;
  gap:16px;flex-wrap:wrap}
.brand{font-weight:600;font-size:14.5px;line-height:1.3}
.stats{margin-left:auto;display:flex;gap:16px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.stats b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.stats .g b{color:var(--ok)}
.stats .r b{color:var(--bad)}
.stats .sc b{color:var(--accent)}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
/* ---------- hero ---------- */
.hero{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:18px 0 0}
.hero h1{margin:0 0 8px;font-size:20px;letter-spacing:.2px}
.hero .meta{font-size:13.5px;color:var(--muted);margin:0 0 6px}
.hero .meta b{color:var(--ink)}
.hero .note{font-size:13px;color:var(--muted);margin:8px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
/* ---------- toolbar + mode switch ---------- */
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 0 2px;flex-wrap:wrap}
.tb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font:inherit;
  font-size:13.5px;cursor:pointer;color:var(--ink);transition:.13s}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;
  user-select:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px}
.switch input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.switch .hint{font-size:12px;color:var(--muted)}
.switch:has(input:disabled){opacity:.55;cursor:not-allowed}
.switch input:disabled{cursor:not-allowed}
/* segmented mode control */
.modebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:14px 0 0}
.modelabel{font-size:13.5px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f8fafc}
.seg button{border:0;background:transparent;font:inherit;font-size:13.5px;padding:7px 20px;
  cursor:pointer;color:var(--muted);transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.modehint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.modehint b{color:var(--ink)}
/* ---------- sections ---------- */
.sec{margin:26px 0 8px;padding:12px 16px;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:8px}
.sec h2{margin:0;font-size:16px}
.sec p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
/* ---------- question ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 18px;
  margin:11px 0;transition:border-color .15s,background .15s;scroll-margin-top:80px}
.q.ok{border-color:#bbf7d0;background:var(--okbg)}
.q.bad{border-color:#fecaca;background:var(--badbg)}
.q.miss{border-color:#fde68a;background:var(--missbg)}
.q.flash{box-shadow:0 0 0 3px rgba(37,99,235,.4)}
.qhead{display:flex;gap:11px;align-items:flex-start}
.qno{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:6px;background:#eef2ff;
  color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center;
  justify-content:center;margin-top:2px;font-variant-numeric:tabular-nums}
.stem{margin:0;flex:1;font-size:15px}
.selcount{flex:none;font-size:12px;font-weight:600;color:var(--accent);background:#eff6ff;
  border:1px solid #dbeafe;border-radius:20px;padding:1px 10px;margin-top:3px;opacity:0;
  transition:opacity .15s;white-space:nowrap}
.selcount.on{opacity:1}
.opts{margin:12px 0 0 37px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  transition:.12s;width:100%}
.opt:hover:not(.locked){border-color:var(--accent);background:#f8faff}
.opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
  color:var(--muted);margin-top:1px}
.opt .t{flex:1}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.sel{border-color:var(--accent);background:#eff6ff}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.locked{cursor:default}
.tf .opt{font-size:16px;padding:11px 16px}
.tf .opt .k{display:none}
.fb{margin:11px 0 0 37px;font-size:13.5px;font-weight:600}
.q.ok .fb{color:var(--ok)}
.q.bad .fb{color:var(--bad)}
.q.miss .fb{color:var(--warn)}
.confirm{margin:11px 0 0 37px;border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:8px;padding:8px 20px;font:inherit;font-size:14px;cursor:pointer;transition:.13s}
.confirm:hover:not(:disabled){background:#1d4ed8}
.confirm:disabled{opacity:.4;cursor:not-allowed}
/* ---------- bottom bar ---------- */
.subbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(0,0,0,.06)}
.subbar .inner{max-width:880px;margin:0 auto;padding:11px 16px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.sbinfo{margin-right:auto;font-size:13.5px;color:var(--muted)}
.sbinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.sbinfo .hi{color:var(--warn)}
.sbinfo .g{color:var(--ok)}
.sbinfo .r{color:var(--bad)}
.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  padding:9px 26px;font-size:14px}
.tb.primary:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;z-index:100;padding:20px}
.modal.on{display:flex;align-items:flex-start;justify-content:center}
.box{background:#fff;border-radius:12px;max-width:780px;width:100%;max-height:88vh;
  overflow:auto;padding:20px 22px}
.box h3{margin:0 0 4px;font-size:17px}
.box .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.box .close{position:sticky;top:0;float:right;border:none;background:#f3f4f6;border-radius:8px;
  width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--muted)}
.scorebox{background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #dbeafe;
  border-radius:12px;padding:18px 20px;margin:0 0 14px;text-align:center}
.bigscore{font-size:15px;color:var(--muted);line-height:1}
.bigscore b{font-size:52px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  line-height:1.1;margin-right:2px}
.scoreline{font-size:13.5px;color:var(--muted);margin-top:8px}
.scoreline b{color:var(--ink)}
.scoreline .ok{color:var(--ok);font-weight:600}
.scoreline .bad{color:var(--bad);font-weight:600}
.scoreline .miss{color:var(--warn);font-weight:600}
.secscores{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.secscore{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:#fff;
  font-size:12.5px;color:var(--muted);min-width:120px}
.secscore b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.wrongitem{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;
  padding:12px 14px;margin:10px 0;cursor:pointer;transition:.13s}
.wrongitem.miss{border-left-color:var(--warn)}
.wrongitem:hover{background:#fafafa;border-color:var(--accent)}
.wrongitem .s{font-size:14px;margin:0 0 6px}
.wrongitem .a{font-size:12.5px;color:var(--muted)}
.wrongitem .a .no{color:var(--bad);font-weight:600}
.wrongitem .a .mp{color:var(--warn);font-weight:600}
.wrongitem .a .yes{color:var(--ok);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
@media (max-width:560px){
  .opts,.fb,.confirm{margin-left:0}
  .hero{padding:16px}
  .hero h1{font-size:17px}
  .brand{font-size:13px}
  .stats{gap:11px}
  .sbinfo{width:100%;margin-right:0}
  .tb.primary{flex:1}
  .bigscore b{font-size:42px}
  .seg button{padding:7px 14px;font-size:13px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">食品安全与特种设备监管应知应会测试卷</div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="pbar"><i id="pbar"></i></div>
</div>

<div class="wrap">
  <div class="hero">
    <h1 id="ttl"></h1>
    <p class="meta">满分：<b id="mFull"></b> 分 &nbsp;·&nbsp; 建议时长：<b id="mMin"></b> 分钟 &nbsp;·&nbsp; 共 <b>100</b> 题</p>
    <p class="meta">单选 <b>70</b> 题 · 判断 <b>15</b> 题 · 多选 <b>15</b> 题 &nbsp;|&nbsp; 每题 1 分</p>
    <p class="note" id="mNote"></p>
  </div>

  <div class="modebar">
    <span class="modelabel">答题模式</span>
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="practice" class="on">练习模式</button>
      <button type="button" data-mode="exam">考试模式</button>
    </div>
    <p class="modehint" id="modeHint"></p>
  </div>

  <div class="toolbar">
    <label class="switch" title="开启后每次进入页面，单选题与多选题的选项顺序随机打乱（正确答案随之变化）">
      <input type="checkbox" id="shuffle" checked> 选项乱序
      <span class="hint">打乱选项，避免死记答案位置</span>
    </label>
    <button class="tb" id="reviewBtn" style="display:none">查看答题结果</button>
    <button class="tb" id="resetBtn">重新开始</button>
  </div>

  <main id="main"></main>
  <p style="text-align:center;color:var(--muted);font-size:12.5px;margin:30px 0 40px" id="footTip"></p>
</div>

<div class="subbar">
  <div class="inner">
    <div class="sbinfo" id="sbInfo"></div>
    <button class="tb" id="nextUnans">下一个未答</button>
    <button class="tb primary" id="submitBtn">提交试卷</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" id="closeBtn" title="关闭">✕</button>
    <h3 id="resTitle">答题结果</h3>
    <p class="sub" id="resSub">点击题目可直接跳回原题查看</p>
    <div id="scoreArea"></div>
    <div id="wrongList"></div>
  </div>
</div>

ions":[{"key":"A","text":"装修材料无毒、无异味、不吸水、易清洁"},{"key":"B","text":"无破损、无霉斑"},{"key":"C","text":"无灰尘聚集、无有害生物隐匿"},{"key":"D","text":"可直接使用普通劣质石膏板"}],"answer":"ABC","score":1},{"no":8,"type":"multi","stem":"副食品店墙壁的装修及日常维护要求有哪些？（ ）","options":[{"key":"A","text":"墙壁统一刷白"},{"key":"B","text":"保持无破损、无霉斑、无积垢"},{"key":"C","text":"禁止使用劣质墙纸、隔板"},{"key":"D","text":"为美观可张贴深色劣质墙纸"}],"answer":"ABC","score":1},{"no":9,"type":"multi","stem":"副食品店门窗的病媒防制设施要求包括哪些？（ ）","options":[{"key":"A","text":"窗户设置防蝇纱网"},{"key":"B","text":"进门处风幕机可选择安装"},{"key":"C","text":"后门安装磁吸纱帘、纱门或折叠隐形推拉纱门"},{"key":"D","text":"门窗无需设置任何防蝇设施"}],"answer":"ABC","score":1},{"no":10,"type":"multi","stem":"副食品店地面的装修及日常维护要求有哪些？（ ）","options":[{"key":"A","text":"采用瓷砖、地板等材质硬化固化"},{"key":"B","text":"地面平整、无裂缝、无破损"},{"key":"C","text":"无积水、无污垢"},{"key":"D","text":"可保留原生泥土地面"}],"answer":"ABC","score":1},{"no":11,"type":"multi","stem":"副食品店销售散装食品，食品标签需要标注的内容有哪些？（ ）","options":[{"key":"A","text":"食品名称、生产日期、保质期"},{"key":"B","text":"生产地址、生产企业名称"},{"key":"C","text":"生产企业联系方式"},{"key":"D","text":"食品的进货底价"}],"answer":"ABC","score":1},{"no":12,"type":"multi","stem":"副食品店销售保健食品的法定要求包括以下哪些？（ ）","options":[{"key":"A","text":"设置销售专柜或者专区"},{"key":"B","text":"显著位置标明 “保健食品销售专区或者专柜” 字样"},{"key":"C","text":"显著位置标注 “本品不能代替药物” 警示语"},{"key":"D","text":"与普通散装食品混放售卖，无需设置标识"}],"answer":"ABC","score":1},{"no":13,"type":"multi","stem":"副食品店食品仓库的管理要求包括哪些？（ ）","options":[{"key":"A","text":"食品仓库单独设立"},{"key":"B","text":"不得与非食品物品共同存放"},{"key":"C","text":"仓库内严禁存放有毒有害物品"},{"key":"D","text":"可与员工宿舍、卫生间连通使用"}],"answer":"ABC","score":1},{"no":14,"type":"multi","stem":"特种设备安全管理人员应当严格把关，坚决不采购、不使用下列哪类特种设备？（ ）","options":[{"key":"A","text":"未取得许可生产的特种设备"},{"key":"B","text":"未经检验合格的特种设备"},{"key":"C","text":"国家明令淘汰的特种设备"},{"key":"D","text":"已经报废的特种设备"}],"answer":"ABCD","score":1},{"no":15,"type":"multi","stem":"气瓶充装作业人员应当严格落实充装前检查制度，严禁充装下列哪些不符合规范要求的气瓶？（ ）","options":[{"key":"A","text":"报废瓶、过期瓶"},{"key":"B","text":"改装瓶、翻新瓶"},{"key":"C","text":"非自有产权瓶（托管气瓶除外）"},{"key":"D","text":"检验合格的自有产权气瓶"}],"answer":"ABC","score":1}]};</script>
<script>
(function(){
  'use strict';

  var SECTIONS = [
    {key:'single', title:'一、单项选择题', desc:'共 70 题，每题 1 分，共 70 分'},
    {key:'tf',     title:'二、判断题',     desc:'共 15 题，每题 1 分，共 15 分'},
    {key:'multi',  title:'三、多项选择题', desc:'共 15 题，每题 1 分，共 15 分'}
  ];
  var TOTAL = 100;

  /**
   * mode: 'practice' 练习模式 —— 每题作答后立即判分并显示正确答案
   *       'exam'     考试模式 —— 先作答，点「提交试卷」后统一判分
   */
  var state = { mode:'practice', shuffle:true, order:{}, picked:{}, graded:{}, submitted:false };

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  };
  function qid(sec,no){ return sec + '-' + no; }
  function shuffleArr(a){
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 显示顺序（乱序时缓存，保证重绘稳定）
  function displayOpts(sec,q){
    var id = qid(sec,q.no);
    if(!state.order[id]){
      var arr;
      if(q.type === 'tf'){
        arr = [{key:'√', text:'正确'}, {key:'×', text:'错误'}];   // 判断题固定顺序
      } else {
        arr = q.options.map(function(o){ return {key:o.key, text:o.text}; });
        if(state.shuffle) shuffleArr(arr);
      }
      state.order[id] = arr;
    }
    return state.order[id];
  }

  // 正确答案对应的"选项文本"集合——按文本判题，因此乱序后依然正确
  function correctTexts(q){
    if(q.type === 'tf') return [ q.answer === '√' ? '正确' : '错误' ];
    return q.options.filter(function(o){ return q.answer.indexOf(o.key) > -1; })
                    .map(function(o){ return o.text; });
  }
  function judge(q,picked){
    var c = correctTexts(q);
    if(picked.length !== c.length) return false;
    for(var i=0;i<picked.length;i++){ if(c.indexOf(picked[i]) < 0) return false; }
    return true;
  }
  function lockedFor(id){
    // 练习模式：该题已判分即锁定；考试模式：交卷后全部锁定
    return !!state.graded[id];
  }

  // ---------- 渲染单题（仅在构建/重置/切模式/换乱序时调用）----------
  function card(sec,q){
    var id = qid(sec,q.no);
    var opts = displayOpts(sec,q);

    var el = document.createElement('div');
    el.className = 'q' + (sec==='tf' ? ' tf' : '');
    el.id = id;

    var head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = '<span class="qno">' + q.no + '</span><p class="stem">' + esc(q.stem) + '</p>' +
                     '<span class="selcount"></span>';
    el.appendChild(head);

    var box = document.createElement('div');
    box.className = 'opts';
    opts.forEach(function(o,i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.innerHTML = '<span class="k">' + (q.type==='tf' ? '' : 'ABCD'.charAt(i)) + '</span>' +
                    '<span class="t">' + esc(o.text) + '</span>';
      b.addEventListener('click', function(){ onPick(sec,q,o.text); });
      box.appendChild(b);
    });
    el.appendChild(box);

    // 多选题需要「确认答案」按钮；判断题/单选题不需要
    if(q.type === 'multi'){
      var cb = document.createElement('button');
      cb.type = 'button';
      cb.className = 'confirm';
      cb.textContent = '确认答案';
      cb.disabled = true;
      cb.addEventListener('click', function(){
        var s = state.picked[id];
        if(s && s.length && !lockedFor(id)) gradeNow(sec,q,s.slice());
      });
      el.appendChild(cb);
    }

    var fb = document.createElement('div');
    fb.className = 'fb';
    fb.style.display = 'none';
    el.appendChild(fb);

    repaint(sec,q);      // 依据当前状态补齐样式
    return el;
  }

  /**
   * 就地刷新一道题的外观。
   * 关键：绝不重建卡片 DOM —— 重建会让正在进行的点击失去目标节点
   * （mousedown 落在旧节点、mouseup 时节点已被替换，浏览器便不再派发 click），
   * 造成「明明点了却没选上」。这里只切 class / 显隐元素，节点保持不变。
   */
  function repaint(sec,q){
    var cardEl = $(qid(sec,q.no));
    if(!cardEl) return;
    var id = qid(sec,q.no);
    var picked = state.picked[id] || [];
    var g = state.graded[id];
    var opts = displayOpts(sec,q);
    var ctexts = correctTexts(q);
    var btns = cardEl.querySelectorAll('.opt');
    var correctLetters = [];

    for(var i=0;i<btns.length && i<opts.length;i++){
      var b = btns[i], txt = opts[i].text;
      var isCorrect = ctexts.indexOf(txt) > -1;
      var isPicked  = picked.indexOf(txt) > -1;
      b.classList.remove('sel','correct','wrong','locked');
      if(g){
        b.classList.add('locked');
        if(isCorrect){ b.classList.add('correct'); if(q.type!=='tf') correctLetters.push('ABCD'.charAt(i)); }
        else if(isPicked){ b.classList.add('wrong'); }
      } else if(isPicked){
        b.classList.add('sel');
      }
    }

    cardEl.classList.remove('ok','bad','miss');
    if(g) cardEl.classList.add(g.unanswered ? 'miss' : (g.ok ? 'ok' : 'bad'));

    var fb = cardEl.querySelector('.fb');
    if(g){
      var ansTxt = (q.type === 'tf') ? (q.answer === '√' ? '正确' : '错误')
                                     : correctLetters.join('、');
      fb.textContent = g.unanswered
        ? ('— 未作答　正确答案：' + ansTxt)
        : (g.ok ? '✓ 回答正确' : ('✗ 回答错误　正确答案：' + ansTxt));
      fb.style.display = '';
    } else {
      fb.textContent = '';
      fb.style.display = 'none';
    }

    var cb = cardEl.querySelector('.confirm');
    if(cb){
      cb.style.display = (!g && q.type==='multi') ? '' : 'none';
      cb.disabled = !picked.length;
    }

    var badge = cardEl.querySelector('.selcount');
    if(badge){
      if(!g && q.type === 'multi' && picked.length){
        badge.textContent = '已选 ' + picked.length + ' 项';
        badge.classList.add('on');
      } else {
        badge.textContent = '';
        badge.classList.remove('on');
      }
    }
  }

  // ---------- 作答 ----------
  function onPick(sec,q,text){
    var id = qid(sec,q.no);
    if(lockedFor(id)) return;                    // 已判分（练习）或已交卷（考试）
    if(state.submitted) return;

    var cur = state.picked[id] || (state.picked[id] = []);

    if(q.type === 'multi'){
      var k = cur.indexOf(text);
      if(k > -1) cur.splice(k,1); else cur.push(text);
      repaint(sec,q);
      updateStats();
      return;
    }

    // 单选 / 判断：替换式选择
    state.picked[id] = [text];
    if(state.mode === 'practice'){
      gradeNow(sec,q,[text]);                    // 练习模式立即判分
      return;
    }
    repaint(sec,q);
    updateStats();
  }

  // 判一道题（练习模式逐题判；考试模式交卷时批量判）
  function gradeNow(sec,q,picked){
    var id = qid(sec,q.no);
    state.graded[id] = { ok: judge(q,picked), unanswered:false, picked:picked.slice() };
    repaint(sec,q);
    updateStats();
  }

  // ---------- 交卷（仅考试模式）----------
  function submitPaper(){
    if(state.mode !== 'exam' || state.submitted) return;
    var done = 0;
    SECTIONS.forEach(function(s){
      DATA[s.key].forEach(function(q){
        if((state.picked[qid(s.key,q.no)] || []).length) done++;
      });
    });
    var miss = TOTAL - done;
    var msg = miss > 0
      ? ('还有 ' + miss + ' 题未作答，未作答不得分。\n确定要提交试卷吗？')
      : '确定要提交试卷吗？提交后将无法修改答案。';
    if(!confirm(msg)) return;

    state.submitted = true;
    SECTIONS.forEach(function(s){
      DATA[s.key].forEach(function(q){
        var id = qid(s.key,q.no);
        var p = state.picked[id] || [];
        state.graded[id] = p.length
          ? { ok: judge(q,p), unanswered:false, picked:p.slice() }
          : { ok:false, unanswered:true, picked:[] };
      });
    });
    $('shuffle').disabled = true;
    buildAll();
    updateStats();
    openResult();
  }

  // ---------- 统计 ----------
  /**
   * 统计口径（两种模式统一）：
   *   done    已判分的题数
   *   pending 已选择但尚未判分的题数（仅练习模式下多选勾选后未点「确认答案」）
   *   ok/bad  已判分中的对 / 错
   * 这样练习模式下「只勾选未确认」的多选不会被误算成答错。
   */
  function tally(){
    var done=0, ok=0, bad=0, pending=0;
    SECTIONS.forEach(function(s){
      DATA[s.key].forEach(function(q){
        var id = qid(s.key,q.no);
        var g = state.graded[id];
        if(g){
          done++;
          if(g.ok) ok++; else bad++;
        } else if((state.picked[id] || []).length){
          pending++;
        }
      });
    });
    return {done:done, ok:ok, bad:bad, pending:pending};
  }

  function updateStats(){
    var t = tally();
    var isExam = (state.mode === 'exam');
    var answered = t.done + t.pending;      // 考试模式下"已选择"即视为已答

    if(isExam && state.submitted){
      $('stats').innerHTML =
        '<span class="g">正确 <b>' + t.ok + '</b></span>' +
        '<span class="r">错误 <b>' + (TOTAL - t.ok) + '</b></span>' +
        '<span class="sc">得分 <b>' + t.ok + '</b></span>';
      $('sbInfo').innerHTML = '本卷得分 <b>' + t.ok + '</b> / ' + TOTAL + ' 分';
      $('nextUnans').style.display = 'none';
      $('submitBtn').style.display = 'none';
      $('reviewBtn').style.display = '';
      $('pbar').style.width = '100%';
      return;
    }

    if(isExam){
      $('stats').innerHTML =
        '<span>已答 <b>' + answered + '</b>/' + TOTAL + '</span>' +
        '<span>未答 <b class="' + (answered<TOTAL?'hi':'') + '">' + (TOTAL - answered) + '</b></span>';
      $('sbInfo').innerHTML = '已答 <b>' + answered + '</b> / ' + TOTAL +
        (answered < TOTAL ? '　未答 <b class="hi">' + (TOTAL - answered) + '</b>'
                          : '　已全部作答，可以提交了');
      $('nextUnans').style.display = (answered < TOTAL) ? '' : 'none';
      $('submitBtn').style.display = '';
      $('reviewBtn').style.display = answered ? '' : 'none';
    } else {
      // 练习模式：区分「已判分」与「已选待确认」，避免把未确认的多选算成答错
      $('stats').innerHTML =
        '<span>已答 <b>' + t.done + '</b>/' + TOTAL + '</span>' +
        '<span class="g">正确 <b>' + t.ok + '</b></span>' +
        '<span class="r">错误 <b>' + t.bad + '</b></span>' +
        '<span class="sc">得分 <b>' + t.ok + '</b></span>';
      var extra = t.pending ? '　待确认 <b class="hi">' + t.pending + '</b>' : '';
      $('sbInfo').innerHTML = t.done
        ? ('已判分 <b>' + t.done + '</b> / ' + TOTAL +
           '　正确 <b class="g">' + t.ok + '</b>　错误 <b class="r">' + t.bad + '</b>' + extra)
        : ('共 ' + TOTAL + ' 题　选择答案后立即判分');
      $('nextUnans').style.display = (t.done < TOTAL) ? '' : 'none';
      $('submitBtn').style.display = 'none';
      $('reviewBtn').style.display = t.done ? '' : 'none';
    }
    $('pbar').style.width = (t.done / TOTAL * 100) + '%';
  }

  function buildAll(){
    var main = $('main');
    main.innerHTML = '';
    SECTIONS.forEach(function(s){
      var box = document.createElement('section');
      var hd = document.createElement('div');
      hd.className = 'sec';
      hd.innerHTML = '<h2>' + s.title + '</h2><p>' + s.desc + '</p>';
      box.appendChild(hd);
      DATA[s.key].forEach(function(q){ box.appendChild(card(s.key,q)); });
      main.appendChild(box);
    });
    updateStats();
  }

  // ---------- 成绩与错题 ----------
  function sectionScore(s){
    var total = 0, ok = 0;
    DATA[s.key].forEach(function(q){
      total++;
      var g = state.graded[qid(s.key,q.no)];
      if(g && g.ok) ok++;
    });
    return {total:total, ok:ok};
  }

  function renderResult(){
    var ok = 0, bad = 0, miss = 0;
    SECTIONS.forEach(function(s){
      DATA[s.key].forEach(function(q){
        var g = state.graded[qid(s.key,q.no)];
        if(!g) return;
        if(g.ok) ok++; else if(g.unanswered) miss++; else bad++;
      });
    });

    var secHtml = SECTIONS.map(function(s){
      var r = sectionScore(s);
      return '<div class="secscore">' + s.title.replace(/^[一二三]、/,'') +
             '<b>' + r.ok + ' / ' + r.total + '</b></div>';
    }).join('');

    $('resTitle').textContent = (state.mode === 'exam') ? '考试成绩' : '练习结果';

    $('scoreArea').innerHTML =
      '<div class="scorebox">' +
        '<div class="bigscore"><b>' + ok + '</b>分</div>' +
        '<div class="scoreline">' +
          '答对 <span class="ok">' + ok + '</span> 题　' +
          '答错 <span class="bad">' + bad + '</span> 题　' +
          '未作答 <span class="miss">' + miss + '</span> 题　' +
          '正确率 <b>' + Math.round(ok / TOTAL * 100) + '%</b>' +
        '</div>' +
        '<div class="secscores">' + secHtml + '</div>' +
      '</div>';

    var wrong = [], missed = [];
    SECTIONS.forEach(function(s){
      DATA[s.key].forEach(function(q){
        var g = state.graded[qid(s.key,q.no)];
        if(!g || g.ok) return;
        (g.unanswered ? missed : wrong).push({sec:s.key, q:q, g:g, title:s.title});
      });
    });

    if(!wrong.length && !missed.length){
      $('wrongList').innerHTML = '<p class="empty">' +
        (ok ? '全部答对，没有错题。' : '还没有作答记录，先去做题吧。') + '</p>';
      return;
    }

    var item = function(w){
      return '<div class="wrongitem' + (w.g.unanswered ? ' miss' : '') +
             '" data-sec="' + w.sec + '" data-no="' + w.q.no + '">' +
             '<p class="s"><b>' + w.title.charAt(0) + '·' + w.q.no + '</b>　' + esc(w.q.stem) + '</p>' +
             '<p class="a">' + pickLine(w) + '</p></div>';
    };

    var html = '';
    if(wrong.length){
      html += '<p class="sub">答错 ' + wrong.length + ' 题（点击可跳回原题查看）</p>';
      html += wrong.map(item).join('');
    }
    if(missed.length){
      html += '<p class="sub">未作答 ' + missed.length + ' 题（点击可跳回原题查看）</p>';
      html += missed.map(item).join('');
    }
    $('wrongList').innerHTML = html;

    Array.prototype.forEach.call($('wrongList').querySelectorAll('.wrongitem'), function(el){
      el.addEventListener('click', function(){
        closeModal();
        var t = $(el.getAttribute('data-sec') + '-' + el.getAttribute('data-no'));
        if(t){
          t.scrollIntoView({behavior:'smooth', block:'center'});
          t.classList.add('flash');
          setTimeout(function(){ t.classList.remove('flash'); }, 1400);
        }
      });
    });
  }

  // 按当前页面显示的选项字母呈现，保证与卡片一致
  function pickLine(w){
    var disp = displayOpts(w.sec, w.q);
    var posOf = function(t){
      for(var i=0;i<disp.length;i++){ if(disp[i].text === t) return i; }
      return 99;
    };
    var letterOf = function(t){
      for(var i=0;i<disp.length;i++){ if(disp[i].text === t) return 'ABCD'.charAt(i); }
      return '';
    };
    var byPos = function(a,b){ return posOf(a) - posOf(b); };
    var ctexts = correctTexts(w.q);

    if(w.q.type === 'tf'){
      return '你的选择：<span class="' + (w.g.unanswered ? 'mp' : 'no') + '">' +
             (w.g.unanswered ? '未作答' : (w.g.picked[0] || '')) + '</span>　|　' +
             '正确答案：<span class="yes">' + (w.q.answer === '√' ? '正确' : '错误') + '</span>';
    }
    var right = ctexts.slice().sort(byPos)
                     .map(function(t){ return letterOf(t) + '.' + t; }).join('　');
    var mine = w.g.unanswered
      ? '<span class="mp">未作答</span>'
      : '<span class="no">' + w.g.picked.slice().sort(byPos)
          .map(function(t){ return letterOf(t) || t; }).join('、') + '</span>';
    return '你的选择：' + mine + '　|　正确答案：<span class="yes">' + esc(right) + '</span>';
  }

  function openResult(){ renderResult(); $('modal').classList.add('on'); }
  function closeModal(){ $('modal').classList.remove('on'); }

  // ---------- 下一个未答 ----------
  function nextUnanswered(){
    var target = null;
    for(var i=0;i<SECTIONS.length && !target;i++){
      var s = SECTIONS[i];
      for(var j=0;j<DATA[s.key].length;j++){
        var q = DATA[s.key][j];
        if(!(state.picked[qid(s.key,q.no)] || []).length){ target = qid(s.key,q.no); break; }
      }
    }
    if(!target) return;
    var t = $(target);
    if(t){
      t.scrollIntoView({behavior:'smooth', block:'center'});
      t.classList.add('flash');
      setTimeout(function(){ t.classList.remove('flash'); }, 1400);
    }
  }

  // ---------- 模式切换 ----------
  function applyModeUI(){
    var isExam = (state.mode === 'exam');
    Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-mode') === state.mode);
    });
    $('modeHint').innerHTML = isExam
      ? '先作答全部题目，点底部「<b>提交试卷</b>」后统一判分并给出成绩。'
      : '每题作答后<b>立即判分</b>并显示正确答案，适合边学边练。多选题需点「确认答案」。';
    $('footTip').textContent = isExam
      ? '考试模式：选择答案后点击底部「提交试卷」，系统统一判分并给出成绩。'
      : '练习模式：选择答案后立即判分并显示正确答案，可随时点「查看答题结果」查看错题。';
    $('shuffle').disabled = (isExam && state.submitted);
    updateStats();
  }

  function resetAll(){
    state.order = {}; state.picked = {}; state.graded = {}; state.submitted = false;
    $('shuffle').disabled = false;
    closeModal();
    buildAll();
    applyModeUI();
  }

  function switchMode(mode){
    if(state.mode === mode) return;
    var t = tally();
    if((t.done + t.pending) > 0 && !confirm('切换模式会清空当前作答记录，确定切换吗？')) return;
    state.mode = mode;
    resetAll();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // ---------- 交互绑定 ----------
  Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ switchMode(b.getAttribute('data-mode')); });
  });
  $('shuffle').addEventListener('change', function(){
    if(state.mode === 'exam' && state.submitted) return;
    state.shuffle = this.checked;
    state.order = {};          // 重新洗牌
    buildAll();                // 已判分结果按"文本"保存，重绘后依然正确
  });
  $('submitBtn').addEventListener('click', submitPaper);
  $('nextUnans').addEventListener('click', nextUnanswered);
  $('reviewBtn').addEventListener('click', openResult);
  $('resetBtn').addEventListener('click', function(){
    var t = tally();
    if((t.done + t.pending) > 0 && !confirm('确定要清空所有作答记录，重新开始吗？')) return;
    resetAll();
    window.scrollTo({top:0, behavior:'smooth'});
  });
  $('closeBtn').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  // ---------- 初始化 ----------
  $('ttl').textContent = DATA.title;
  $('mFull').textContent = DATA.meta.fullScore;
  $('mMin').textContent = DATA.meta.minutes;
  $('mNote').textContent = DATA.meta.note;
  state.shuffle = $('shuffle').checked;
  buildAll();
  applyModeUI();
})();
</script>
</body>
</html>
